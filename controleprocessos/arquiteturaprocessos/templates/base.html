<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head %}{% endblock %}
</head>
<body class="bg-[#F0FFFF] text-gray-100 font-sans min-h-screen flex flex-col">
    {% include 'navbar.html' %}

    <main class="flex-grow container mx-auto px-4 py-6">
        {% block body %} {% endblock %}
    </main>

    <!--<footer class="bg-[#0097A7] text-[#1F70C2] text-center py-4"> -->
    <footer class="bg-[#0097A7] text-white text-center py-4">
        SEGER - GPP | Contato: Tel (27) 3636-5272 | Email: gpp@seg.er.es.gov.br
    </footer>

    <script>
        const nav = document.querySelector('nav');
        document.addEventListener("scroll", () => {
            if (scrollY > 100) {
                if (scrollY > window.innerHeight) {
                    nav.classList.add('invisible');
                } else {
                    nav.classList.add('bg-gray-900');
                    nav.classList.remove('invisible');
                }
            } else {
                nav.classList.remove('bg-gray-900');
                nav.classList.remove('invisible');
            }
        });
    </script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
