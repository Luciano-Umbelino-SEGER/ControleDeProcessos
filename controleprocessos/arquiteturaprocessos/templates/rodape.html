{% load static %}

<!--
  Rodapé — identidade visual da Rede de ELPI (Manual de Marca, versão 1, março/2026)
  - Fundo Azul Central (#0C1851): fundo institucional, que permite a marca colorida.
  - Régua de marcas: Rede de ELPI à esquerda e Governo do Estado à direita, com a mesma altura.
  - Assinatura Principal com 44 px de altura (mínimo do manual: 35 px).
  - Área de segurança: 40 px (largura do símbolo) entre as marcas e até a borda esquerda.
  - Imagens na resolução exata de exibição, com versão @2x para telas de alta densidade.
  - Telas pequenas: apenas o símbolo, com 36 px (mínimo do manual: 35 px).
  - Altura total de 48 px, a mesma reservada pelo layout em base.html.
-->
<footer class="bg-[#0C1851] text-white pl-10 pr-6 py-0.5 h-12 fixed bottom-0 w-full">
  <div class="flex items-center justify-between h-full max-w-full gap-6">

    <!-- ESQUERDA: MARCAS -->
    <div class="flex items-center gap-10 flex-shrink-0">

      <!-- REDE DE ELPI — Assinatura Principal (telas a partir de 640 px) -->
      <img src="{% static 'images/elpi/elpi_assinatura_principal.png' %}"
           srcset="{% static 'images/elpi/elpi_assinatura_principal.png' %} 1x,
                   {% static 'images/elpi/elpi_assinatura_principal@2x.png' %} 2x"
           alt="Rede de ELPI"
           class="hidden sm:block h-11 w-auto">

      <!-- REDE DE ELPI — Símbolo (telas menores que 640 px) -->
      <img src="{% static 'images/elpi/elpi_simbolo.png' %}"
           srcset="{% static 'images/elpi/elpi_simbolo.png' %} 1x,
                   {% static 'images/elpi/elpi_simbolo@2x.png' %} 2x"
           alt="Rede de ELPI"
           class="block sm:hidden h-9 w-auto">

      <!-- GOVERNO DO ESTADO DO ESPÍRITO SANTO -->
      <img src="{% static 'images/logo_goves.png' %}"
           alt="Governo do Estado do Espírito Santo"
           class="h-11 w-auto">

    </div>

    <!-- CENTRO: INFORMAÇÕES (telas a partir de 1280 px) -->
    <div class="hidden xl:block text-base text-center whitespace-nowrap">
      SEGER - GPP | Tel: (27) 3636-5204 | Email: elpi@seger.es.gov.br
    </div>

    <!-- DIREITA: USUÁRIO (telas a partir de 768 px) -->
    <div class="hidden md:block text-sm lg:text-base text-right whitespace-nowrap">
        {% if user.is_authenticated %}
            {{ user.first_name }} {{ user.last_name }}
            —
            {% if user.is_master %}
                <span class="font-semibold">Master do Sistema</span>
            {% elif user.perfil %}
                {{ user.perfil.nome }}
            {% else %}
                Sem perfil
            {% endif %}
        {% endif %}
    </div>

  </div>
</footer>
