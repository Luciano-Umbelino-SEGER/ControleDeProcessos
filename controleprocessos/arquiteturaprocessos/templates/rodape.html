{% load static %}

<footer class="bg-[#0097A7] text-white px-6 py-1.5 fixed bottom-0 w-full">
  <div class="flex items-center justify-between max-w-full">

    <!-- ESQUERDA: LOGOS -->
    <div class="flex items-center gap-4">

      <!-- LOGO ESTADO (GOVES) -->
      <img src="{% static 'images/logo_goves.png' %}"
           alt="Logo Governo do Estado"
           class="h-9 w-auto md:h-8 object-contain">

      <!-- LOGO ELPI (PROPORCIONAL AO ESTADO) -->
      <img src="{% static 'images/ELPI seger branco.png' %}"
           alt="Logo ELPI"
           class="h-5 md:h-6 max-w-[100px] object-contain">

    </div>

    <!-- CENTRO: INFORMAÇÕES (UMA LINHA) -->
    <div class="text-sm md:text-base text-center whitespace-nowrap">
      SEGER - GPP | Tel: (27) 3636-5272 | Email: gpp@seger.es.gov.br
    </div>

    <!-- DIREITA: USUÁRIO -->
    <div class="text-sm md:text-base text-right whitespace-nowrap">
      {% if user.is_authenticated %}
        {{ user.first_name }} {{ user.last_name }} — {{ user.perfil.nome }}
      {% endif %}
    </div>

  </div>
</footer>
