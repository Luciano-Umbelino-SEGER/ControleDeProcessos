{% load static %}
<nav class="bg-white shadow-md py-2 px-4 flex justify-between items-center">
  <!-- Botão hamburger + Logo + Título -->
  <div class="flex items-center space-x-4">
    <button @click= "toggleSidebar()"
            class="text-gray-700 focus:outline-none">
        <i class="fas fa-bars text-2xl"></i>
    </button>

    <a href="{% url 'arquiteturaprocessos:homepage' %}"
       class="flex items-center space-x-2 no-underline">
      <img src="{% static 'images/Logo_GPP_Azul_Hor.png' %}" alt="Logo GPP" class="h-10">
      <span class="text-blue-800 font-bold text-xl">ARQUITETURA DE PROCESSOS</span>
    </a>
  </div>

  <!-- Área de login/sair -->
  <div class="flex items-center space-x-4 font-medium text-[#0E72F5]">
    {% if request.user.is_authenticated %}
      <form method="post" action="{% url 'arquiteturaprocessos:logout' %}">
        {% csrf_token %}
        <button type="submit"
                class="hover:text-blue-800 transition no-underline bg-transparent border-0 cursor-pointer flex items-center space-x-1">
          <span>Sair</span>
          <i class="fas fa-sign-out-alt text-blue-800 text-xl"></i>
        </button>
      </form>
    {% else %}
      <a href="{% url 'arquiteturaprocessos:fazer_login' %}"
         class="hover:text-blue-800 transition no-underline flex items-center space-x-1">
        <span>Login Gestor</span>
        <i class="fas fa-user-circle text-blue-800 text-xl"></i>
      </a>
    {% endif %}
  </div>
</nav>
