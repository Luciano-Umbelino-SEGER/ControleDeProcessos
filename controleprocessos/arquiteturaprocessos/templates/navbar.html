{% load static %}
<nav class="bg-white shadow-md py-2 px-4 flex justify-between items-center">

  <!-- Botão hamburger + Logo + Nome do Sistema -->
  <div class="flex items-center space-x-4">

    <button @click="toggleSidebar()" class="text-gray-700 focus:outline-none">
      <i class="fas fa-bars text-2xl"></i>
    </button>

    <a href="{% url 'arquiteturaprocessos:arquiteturaprocessos' %}"
       class="flex items-center space-x-3 no-underline">

      <!-- LOGO ELPI / SIGEMP RESPONSIVA -->
      <img src="{% static 'images/logo_elpi.png' %}"
           alt="Logo ELPI"
           class="h-14 md:h-16 object-contain">

      <!-- TITULO EM UMA LINHA -->
      <span class="font-bold text-lg md:text-xl tracking-tight"
            style="color:#1B4C9B;">
        SIGEMP – Sistema de Gestão de Monitoramento de Processos
      </span>
    </a>
  </div>

  <!-- Área de login/sair -->
  <div class="flex items-center space-x-4 font-medium" style="color:#1B4C9B;">

    {% if request.user.is_authenticated %}
      <form method="post" action="{% url 'arquiteturaprocessos:logout' %}">
        {% csrf_token %}
        <button type="submit"
                class="hover:opacity-80 transition no-underline bg-transparent border-0 cursor-pointer flex items-center space-x-1">
          <span>Sair</span>
          <i class="fas fa-sign-out-alt text-xl"></i>
        </button>
      </form>

    {% else %}
      <a href="{% url 'arquiteturaprocessos:fazer_login' %}"
         class="hover:opacity-80 transition no-underline flex items-center space-x-1">
        <span>Login Gestor</span>
        <i class="fas fa-user-circle text-xl"></i>
      </a>
    {% endif %}
  </div>
</nav>
