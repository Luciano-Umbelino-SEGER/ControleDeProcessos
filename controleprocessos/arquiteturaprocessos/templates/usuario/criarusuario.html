{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block titulo %}
Fazer Login
{% endblock %}

{% block body %}
<header class="w-[500px] min-h-[40vh] mx-auto bg-blue-50 bg-blend-overlay showcase border-blue-800 border-2 rounded-lg flex justify-center items-center bg-no-repeat">
    <div class="container showcase d-flex justify-content-center align-items-center min-vh-75 py-5" style="backgroud-color: #F0FFFF">
      <div class="z-10 h-full py-32 md:py-0 text-blue-800 text-center flex items-center flex-col">
            <form method="post">
                {% csrf_token %}
                <fieldset class="form-group">
                    <legend class="border-bottom mb-4">Inclusão de Usuário
                    </legend>
                    {{ form|crispy }}
                </fieldset>
                <button class="bg-blue-600 py-1 my-2 px-3 w-full text-white md:text-lg rounded-md" type="submit">Adicionar Usuário</button>
            </form>
        </div>
    </div>
</header>
{% endblock %}
