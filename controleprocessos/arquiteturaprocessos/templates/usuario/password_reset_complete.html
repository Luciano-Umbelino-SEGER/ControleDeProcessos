{% extends "base.html" %}

{% block titulo %}Senha definida{% endblock %}

{% block body %}
<div class="flex justify-center mt-24">
  <div class="bg-blue-50 border border-blue-800 rounded-lg p-6 text-center max-w-md">
    <h2 class="text-xl font-semibold text-blue-800 mb-3">
      ✅ Senha definida com sucesso
    </h2>

    <p class="text-blue-700 mb-4">
      Sua senha foi criada com sucesso.
      Agora você já pode acessar o sistema.
    </p>

    <a href="{% url 'arquiteturaprocessos:fazer_login' %}"
       class="inline-block bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded">
      Ir para o login
    </a>
  </div>
</div>
{% endblock %}
