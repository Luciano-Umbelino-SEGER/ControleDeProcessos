<!-- COMPONENTE: Modal moderno para exibição de documentos PDF -->
<div id="modalListaDocumentos"
     class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 transition-opacity duration-300 ease-out">
  <div id="conteudoModalLista"
       class="bg-white rounded-2xl shadow-2xl border-4 border-[#0097A7] w-11/12 max-w-[90rem] h-[70vh]
             flex flex-col relative overflow-hidden transform scale-95 opacity-0 transition-all duration-300 ease-out">

    <!-- Cabeçalho -->
    <div class="bg-[#0097A7] text-white px-6 py-3 flex justify-between items-center">
      <h3 id="tituloListaDocumentos" class="font-semibold text-lg">
        Documentos Associados ao Processo
      </h3>
      <button onclick="fecharModalListaDocumentos()" class="hover:text-gray-300 transition" title="Fechar">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Conteúdo -->
    <div class="flex-1 bg-gray-50 overflow-y-auto px-6 py-4 space-y-6">

      <!-- MODELO DE PROCESSO -->
      <div>
        <h4 id="titulo-modelos"
            class="text-sm font-semibold text-blue-800 mb-2">
          Modelo de Processo
        </h4>

        <!-- Cabeçalho -->
        <div class="text-sm font-semibold text-blue-600 px-3 pb-0.5">
          Documento(s) Associado(s)
        </div>

        <div class="border-t border-[#0097A7] mt-0.5 mb-2"></div>

        <!-- Lista dinâmica -->
        <div id="lista-modelos"
             class="px-3 py-1 flex flex-wrap items-center gap-x-6 gap-y-2">
        </div>
      </div>

      <div class="border-t-2 border-[#0097A7] mt-10 mb-14"></div>

      <!-- NORMA DE PROCEDIMENTO -->
      <div>

        <!-- Título da seção -->
        <h4 id="titulo-normas"
            class="text-sm font-semibold text-blue-800 mt-4 mb-2">
          Norma de Procedimento (0)
        </h4>

        <!-- Linha superior -->
        <div class="border-t border-[#0097A7] mt-0.5 mb-2"></div>

        <!-- Cabeçalho Norma de Procedimento-->
       <div class="grid grid-cols-[3.25fr_2.75fr_1.35fr_0.65fr_0.95fr_0.95fr]
            text-sm font-semibold text-blue-600 px-3 pb-0.5">

          <span>Nome da Norma</span>
          <span>Sistema</span>
          <span>Código</span>
          <span>Versão</span>
          <span>Elaboração</span>
          <span>Vigência Início</span>

        </div>

        <!-- Linha inferior do cabeçalho -->
        <div class="border-t border-[#0097A7] mt-0.5 mb-2"></div>

        <!-- Lista dinâmica -->
        <div id="lista-normas"
             class="px-3">
        </div>

      </div>

    </div>

    <!-- Viewer PDF (fica oculto até clicar) -->
    <div class="flex-1 bg-gray-100 hidden" id="containerIframe">
      <iframe id="iframeListaDocumento" class="w-full h-full border-none"></iframe>
    </div>


    <!-- Rodapé -->
    <div class="bg-gray-50 text-right px-6 py-3 border-t border-[#0097A7]">
      <button onclick="fecharModalListaDocumentos()"
              class="px-4 py-2 bg-[#0097A7] text-white font-medium rounded-lg shadow hover:bg-[#008494] transition">
        Fechar
      </button>
    </div>
  </div>
</div>



<!-- Script de controle do modal -->
<script>
function criarLinhaModelo(documento) {
  if (!documento) return "";

  const icone = documento.tipo === "url" ? "🔗" : "📄";

  const url = encodeURIComponent(documento.url || "");
  const nome = encodeURIComponent(documento.displayname || "");

  return `
    <div class="flex items-center gap-1.5 text-sm text-gray-900
                min-w-0">

      <span class="shrink-0">${icone}</span>

      <span class="truncate font-medium"
            title="${documento.displayname || ""}">
        ${documento.displayname || ""}
      </span>

      <button
        type="button"
        class="botao-visualizar-modelo text-blue-600 hover:text-blue-800
               ml-1 shrink-0 transition"
        data-url="${url}"
        data-nome="${nome}"
        title="Visualizar Documento">

        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
      </button>

    </div>
  `;
}

function configurarBotoesModelo() {
  document
    .querySelectorAll(".botao-visualizar-modelo")
    .forEach(botao => {

      botao.addEventListener("click", function () {

        const url = decodeURIComponent(this.dataset.url || "");
        const nome = decodeURIComponent(this.dataset.nome || "");

        abrirModalDocumento(url, nome);
      });

    });
}

function abrirModalListaDocumentosPorArrays(modelos, normas, nomeProcesso, tipo = "Processo") {
  const modal        = document.getElementById('modalListaDocumentos');
  const conteudo     = document.getElementById('conteudoModalLista');
  const tituloElem   = document.getElementById('tituloListaDocumentos');
  const listaModelos = document.getElementById("lista-modelos");
  const listaNormas  = document.getElementById("lista-normas");

  const tituloModelos = document.getElementById("titulo-modelos");
  const tituloNormas  = document.getElementById("titulo-normas");

  if (!modal || !conteudo || !tituloElem || !listaModelos || !listaNormas) {
    console.error("[modal-lista] Elementos não encontrados.");
    return;
  }

  modelos = modelos || [];
  normas  = normas  || [];

  listaModelos.innerHTML = "";
  listaNormas.innerHTML  = "";

  if (tituloModelos) {
    tituloModelos.textContent =
      `Modelo de Processo — ${nomeProcesso} (${modelos.length})`;
  }

  if (tituloNormas) {
    tituloNormas.textContent  = `Norma de Procedimento (${normas.length})`;
  }

    // =========================================================
    // NORMA DE PROCEDIMENTO
    // =========================================================
    const criarLinhaNorma = (norma) => {

      const documentos = norma.documentos || [];

      const renderizarDocumento = (documento) => {
        const icone = documento.tipo === "url" ? "🔗" : "📄";
        const url = encodeURIComponent(documento.url || "")
          .replace(/'/g, "%27");
        const nome = encodeURIComponent(documento.displayname || "")
          .replace(/'/g, "%27");

        return `
          <div class="flex items-center gap-1 min-w-0">

            <span class="shrink-0">${icone}</span>

            <span
              class="truncate font-medium"
              title="${documento.displayname || "-"}">
              ${documento.displayname || "-"}
            </span>

            <button
              type="button"
              class="text-blue-600 hover:text-blue-800 ml-1 shrink-0"
              title="Visualizar"
              onclick="abrirModalDocumento(
                decodeURIComponent('${url}'),
                decodeURIComponent('${nome}')
              )">

              <svg xmlns="http://www.w3.org/2000/svg"
                   class="h-5 w-5"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke="currentColor">

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0
                     3 3 0 016 0z"/>

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943
                     7.523 5 12 5
                     c4.477 0 8.268 2.943
                     9.542 7
                     -1.274 4.057
                     -5.065 7
                     -9.542 7
                     -4.477 0
                     -8.268-2.943
                     -9.542-7z"/>

              </svg>

            </button>

          </div>
        `;
      };


      const documentosHtml = documentos.length
        ? documentos.map(renderizarDocumento).join("")
        : `
            <span class="text-gray-400 italic">
              Nenhum documento associado.
            </span>
          `;


      return `
      <!-- DADOS DA NORMA -->
        <div class="grid grid-cols-[3.25fr_2.75fr_1.35fr_0.65fr_0.95fr_0.95fr]
            items-center pt-2 text-sm text-gray-900">

          <!-- Nome da Norma -->
          <span
            class="truncate font-medium pr-4"
            title="${norma.titulo || "-"}">
            ${norma.titulo || "-"}
          </span>

          <!-- Sistema -->
          <span
            class="truncate"
            title="${norma.sistema || "-"}">
            ${norma.sistema || "-"}
          </span>

          <!-- Código -->
          <span class="truncate">
            ${norma.codigo || "-"}
          </span>

          <!-- Versão -->
          <span>
            ${norma.versao || "-"}
          </span>

          <!-- Elaboração -->
          <span>
            ${norma.elaboracao || "-"}
          </span>

          <!-- Vigência Início -->
          <span>
            ${norma.vigencia || "-"}
          </span>
        </div>

        <!-- DOCUMENTOS ASSOCIADOS -->
        <div class="pl-4 pt-2 pb-3 text-sm text-gray-600">

          <div class="flex items-center gap-3 whitespace-nowrap overflow-hidden">

            <span class="italic text-gray-500 shrink-0">
              Documento(s) Associado(s):
            </span>

            ${documentosHtml}

          </div>

        </div>
      `;
    };

  modelos.forEach(modelo => {
    listaModelos.insertAdjacentHTML(
      "beforeend",
      criarLinhaModelo(modelo)
    );
  });

  configurarBotoesModelo();

  normas.forEach(norma => {
    listaNormas.insertAdjacentHTML(
      "beforeend",
      criarLinhaNorma(norma)
    );
  });

  tituloElem.textContent = `Documentos Associados ao ${tipo} ${nomeProcesso}`;

  modal.classList.remove('hidden');
  modal.classList.add('flex');

  setTimeout(() => {
    conteudo.classList.remove('scale-95', 'opacity-0');
    conteudo.classList.add('scale-100', 'opacity-100');
  }, 10);
}
</script>

<script>
function fecharModalListaDocumentos() {
  const modal = document.getElementById('modalListaDocumentos');
  const conteudo = document.getElementById('conteudoModalLista');

  if (!modal || !conteudo) return;

  conteudo.classList.remove('scale-100', 'opacity-100');
  conteudo.classList.add('scale-95', 'opacity-0');

  // 🔽 AQUI É O PONTO CERTO
  fecharPasta(pastaAbertaAtual);

  setTimeout(() => {
    modal.classList.remove('flex');
    modal.classList.add('hidden');
  }, 250);
}
</script>

<script>
  // ===============================
  // Controle da pasta aberta atual
  // ===============================
  let pastaAbertaAtual = null;

  function marcarPastaAberta(botao) {
    if (!botao) return;

    // fecha a anterior, se existir
    if (pastaAbertaAtual) {
      fecharPasta(pastaAbertaAtual);
    }

    pastaAbertaAtual = botao;
    botao.classList.add('aberta');

    const img = botao.querySelector('.pasta-icon');
    if (img && img.dataset.srcAberta) {
      img.src = img.dataset.srcAberta;
    }
  }

  function fecharPasta(botao) {
    if (!botao) return;

    botao.classList.remove('aberta');

    const img = botao.querySelector('.pasta-icon');
    if (img && img.dataset.srcFechada) {
      img.src = img.dataset.srcFechada;
    }

    pastaAbertaAtual = null;
  }
</script>
