<!-- ====================================================================== -->
<!--  MODAL – LISTA DE DOCUMENTOS                                          -->
<!-- ====================================================================== -->

<div id="modalListaDocs"
     class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50 transition">

  <div id="conteudoListaDocs"
       class="bg-white w-11/12 max-w-4xl rounded-xl shadow-2xl border border-blue-300
              transform scale-95 opacity-0 transition-all duration-200">

    <!-- Cabeçalho -->
    <div class="px-5 py-3 bg-blue-700 text-white rounded-t-xl flex justify-between items-center">
      <h3 id="tituloListaDocs" class="text-lg font-semibold">Documentos</h3>

      <button onclick="fecharModalListaDocs()" class="hover:text-gray-300 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Conteúdo -->
    <div class="max-h-[65vh] overflow-y-auto px-5 py-4">

      <!-- Cabeçalho da listagem -->
      <div class="grid grid-cols-7 font-semibold text-blue-800 text-sm pb-2 border-b border-gray-300">
        <div>Nome</div>
        <div>Código</div>
        <div>Seq.</div>
        <div>Tema</div>
        <div>Emitente</div>
        <div>Vigência</div>
        <div class="text-center">Abrir</div>
      </div>

      <!-- Linhas serão inseridas aqui -->
      <div id="listaDocsContainer"></div>

    </div>

    <!-- Rodapé -->
    <div class="px-5 py-3 bg-gray-100 border-t border-gray-300 rounded-b-xl flex justify-end">
      <button onclick="fecharModalListaDocs()"
              class="px-4 py-2 bg-blue-700 text-white rounded-lg hover:bg-blue-800 transition">
        Fechar
      </button>
    </div>

  </div>
</div>


<!-- ====================================================================== -->
<!--  JAVASCRIPT DO MODAL (SEM QUEBRA, COMPLETO)                            -->
<!-- ====================================================================== -->

<script>
/* ================================================================
   ABRIR LISTA DE DOCUMENTOS
================================================================ */
function abrirListaDocumentos(procName, docsJson) {

  const modal = document.getElementById("modalListaDocs");
  const conteudo = document.getElementById("conteudoListaDocs");
  const titulo = document.getElementById("tituloListaDocs");
  const container = document.getElementById("listaDocsContainer");

  titulo.textContent = "Documentos de " + procName;
  container.innerHTML = "";

  if (!docsJson || docsJson.length === 0) {

      container.innerHTML = `
        <div class="py-6 text-center text-gray-500">
          Nenhum documento associado.
        </div>`;
  } else {

      docsJson.forEach(doc => {

          const nome = doc.displayname || "";
          const codigo = doc.codigo || "";
          const seq = String(doc.sequencial || "").padStart(3, "0");
          const tema = doc.tema || "";
          const emit = doc.emitente || "";
          const vig = doc.vigencia || "";

          const linha = `
              <div class="grid grid-cols-7 text-sm py-3 border-b border-gray-200">

                  <div class="text-blue-700 font-medium">${nome}</div>
                  <div>${codigo}</div>
                  <div>${seq}</div>
                  <div>${tema}</div>
                  <div>${emit}</div>
                  <div>${vig}</div>

                  <div class="text-center">
                      <button class="text-blue-600 hover:text-blue-800"
                              onclick="abrirModalDocumento('${doc.url}', '${nome}')">
                          👁
                      </button>
                  </div>

              </div>
          `;

          container.insertAdjacentHTML("beforeend", linha);
      });
  }

  modal.classList.remove("hidden");
  modal.classList.add("flex");

  setTimeout(() => {
      conteudo.classList.remove("scale-95", "opacity-0");
      conteudo.classList.add("scale-100", "opacity-100");
  }, 10);
}


/* ================================================================
   FECHAR MODAL
================================================================ */
function fecharModalListaDocs() {

  const modal = document.getElementById("modalListaDocs");
  const conteudo = document.getElementById("conteudoListaDocs");

  conteudo.classList.remove("scale-100", "opacity-100");
  conteudo.classList.add("scale-95", "opacity-0");

  setTimeout(() => {
      modal.classList.add("hidden");
  }, 200);
}
</script>
