<!-- COMPONENTE: Modal moderno para exibição de documentos PDF -->
<div id="modalListaDocumentos"
     class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 transition-opacity duration-300 ease-out">
  <div id="conteudoModalLista"
       class="bg-white rounded-2xl shadow-2xl border-4 border-[#0097A7] w-11/12 max-w-[90rem] h-[70vh]
             flex flex-col relative overflow-hidden transform scale-95 opacity-0 transition-all duration-300 ease-out">

    <!-- Cabeçalho -->
    <div class="bg-[#0097A7] text-white px-6 py-3 flex justify-between items-center">
      <h3 id="tituloListaDocumentos" class="font-semibold text-lg">
        Documentos Associados ao Processo
      </h3>
      <button onclick="fecharModalListaDocumentos()" class="hover:text-gray-300 transition" title="Fechar">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Conteúdo -->
    <div class="flex-1 bg-gray-50 overflow-y-auto px-6 py-4 space-y-6">

      <!-- MODELO DE PROCESSO -->
      <div>
        <h4 id="titulo-modelos" class="text-sm font-semibold text-blue-800 mb-2">
          Modelo de Processo
        </h4>

        <!-- Cabeçalho das colunas (mantém) -->
        <div class="grid grid-cols-[2.6fr_40px_2.2fr_0.8fr_2.6fr_1.4fr]
                    text-sm font-semibold text-blue-600 px-3 pb-0.5">
          <span>Título</span><span></span><span>Tema</span>
          <span>Versão</span><span>Emitente</span><span>Início de Vigência</span>
        </div>
        <div class="border-t border-[#0097A7] mt-0.5 mb-2"></div>

        <!-- 🔽 AQUI entra a lista dinâmica -->
        <div id="lista-modelos" class="space-y-1"></div>
      </div>

      <div class="border-t-2 border-[#0097A7] mt-10 mb-14"></div>

      <!-- NORMA DE PROCEDIMENTO -->
      <div>
        <h4 id="titulo-normas" class="text-sm font-semibold text-blue-800 mt-4 mb-2">
          Norma de Procedimento
        </h4>

        <!-- Cabeçalho das colunas (mantém) -->
        <div class="grid grid-cols-[2.6fr_40px_2.2fr_0.8fr_2.6fr_1.4fr]
                    text-sm font-semibold text-blue-600 px-3 pb-0.5">
          <span>Título</span><span></span><span>Tema</span>
          <span>Versão</span><span>Emitente</span><span>Início de Vigência</span>
        </div>
        <div class="border-t border-[#0097A7] mt-0.5 mb-2"></div>

        <!-- 🔽 AQUI entra a lista dinâmica -->
        <div id="lista-normas" class="space-y-1"></div>
      </div>

    </div>

    <!-- Viewer PDF (fica oculto até clicar) -->
    <div class="flex-1 bg-gray-100 hidden" id="containerIframe">
      <iframe id="iframeListaDocumento" class="w-full h-full border-none"></iframe>
    </div>


    <!-- Rodapé -->
    <div class="bg-gray-50 text-right px-6 py-3 border-t border-[#0097A7]">
      <button onclick="fecharModalListaDocumentos()"
              class="px-4 py-2 bg-[#0097A7] text-white font-medium rounded-lg shadow hover:bg-[#008494] transition">
        Fechar
      </button>
    </div>
  </div>
</div>

<!-- Script de controle do modal -->
<script>
function abrirModalListaDocumentosPorArrays(modelos, normas, nomeProcesso, tipo = "Processo") {
  const modal        = document.getElementById('modalListaDocumentos');
  const conteudo     = document.getElementById('conteudoModalLista');
  const tituloElem   = document.getElementById('tituloListaDocumentos');
  const listaModelos = document.getElementById("lista-modelos");
  const listaNormas  = document.getElementById("lista-normas");

  const tituloModelos = document.getElementById("titulo-modelos");
  const tituloNormas  = document.getElementById("titulo-normas");

  if (!modal || !conteudo || !tituloElem || !listaModelos || !listaNormas) {
    console.error("[modal-lista] Elementos não encontrados.");
    return;
  }

  // Segurança absoluta
  modelos = modelos || [];
  normas  = normas  || [];

  // Limpa listas
  listaModelos.innerHTML = "";
  listaNormas.innerHTML  = "";

  // 🔹 Títulos das sessões (contador de DOCUMENTOS)
  if (tituloModelos) {
    tituloModelos.textContent = `Modelo de Processo (${modelos.length})`;
  }

  if (tituloNormas) {
    tituloNormas.textContent  = `Norma de Procedimento (${normas.length})`;
  }

  // ======================================================
  // FUNÇÃO criarLinha — COMEÇA AQUI
  // ======================================================
  const criarLinha = (doc) => {

    // 🔹 Contador de ARTEFATOS do documento
    const qtdArtefatos =
      (doc.is_modelo ? 1 : 0) + (doc.is_norma ? 1 : 0);

    return `
      <!-- Linha principal: Documento -->
      <div class="grid grid-cols-[2.6fr_40px_2.2fr_0.8fr_2.6fr_1.4fr]
                  items-center px-3 py-1.5 text-sm text-gray-900
                  hover:bg-gray-100 rounded transition">

        <span class="truncate font-medium">
          ${doc.titulo || "-"}
        </span>

        <span></span>

        <span class="truncate">${doc.tema || "-"}</span>
        <span>${doc.versao ?? "-"}</span>
        <span class="truncate">${doc.emitente || "-"}</span>
        <span>${doc.vigencia || "-"}</span>
      </div>

      <!-- Linha secundária: Artefatos associados -->
      <div class="ml-8 px-3 py-1.5 text-sm text-gray-600
                  flex items-center flex-wrap gap-3">

        <span class="italic text-gray-500">
          Artefatos associados (${qtdArtefatos}):
        </span>

        ${
          doc.is_modelo ? `
          <div class="flex items-center gap-1 max-w-[48%]">
            <span>📄</span>
            <span class="text-xs text-gray-600 whitespace-nowrap">
              Modelo de Processo
            </span>
            <span class="text-xs text-gray-400">–</span>
            <span class="truncate text-sm font-medium"
                  title="${doc.displayname}">
              ${doc.displayname}
            </span>
            <button class="text-blue-600 hover:text-blue-800 ml-1"
                    title="Visualizar Documento"
                    onclick="abrirModalDocumento('${doc.url}', '${doc.displayname}')">
              👁️
            </button>
          </div>
          ` : ''
        }

        ${
          doc.is_modelo && doc.is_norma ? `
            <span class="text-gray-400">|</span>
          ` : ''
        }

        ${
          doc.is_norma ? `
          <div class="flex items-center gap-1 max-w-[48%]">
            <span>🔗</span>
            <span class="text-xs text-gray-600 whitespace-nowrap">
              Norma de Procedimento
            </span>
            <span class="text-xs text-gray-400">–</span>
            <span class="truncate text-sm font-medium"
                  title="${doc.displayname}">
              ${doc.displayname}
            </span>
            <button class="text-blue-600 hover:text-blue-800 ml-1"
                    title="Abrir Norma"
                    onclick="window.open('${doc.url}', '_blank')">
              👁️
            </button>
          </div>
          ` : ''
        }

      </div>
    `;
  };
  // ======================================================
  // FUNÇÃO criarLinha — TERMINA AQUI
  // ======================================================

  modelos.forEach(m => listaModelos.insertAdjacentHTML("beforeend", criarLinha(m)));
  normas.forEach(n  => listaNormas.insertAdjacentHTML("beforeend", criarLinha(n)));

  tituloElem.textContent = `Documentos Associados ao ${tipo} ${nomeProcesso}`;

  modal.classList.remove('hidden');
  modal.classList.add('flex');

  setTimeout(() => {
    conteudo.classList.remove('scale-95', 'opacity-0');
    conteudo.classList.add('scale-100', 'opacity-100');
  }, 10);
}
</script>


<script>
function fecharModalListaDocumentos() {
  const modal = document.getElementById('modalListaDocumentos');
  const conteudo = document.getElementById('conteudoModalLista');

  if (!modal || !conteudo) return;

  conteudo.classList.remove('scale-100', 'opacity-100');
  conteudo.classList.add('scale-95', 'opacity-0');

  // 🔽 AQUI É O PONTO CERTO
  fecharPasta(pastaAbertaAtual);

  setTimeout(() => {
    modal.classList.remove('flex');
    modal.classList.add('hidden');
  }, 250);
}
</script>

<script>
  // ===============================
  // Controle da pasta aberta atual
  // ===============================
  let pastaAbertaAtual = null;

  function marcarPastaAberta(botao) {
    if (!botao) return;

    // fecha a anterior, se existir
    if (pastaAbertaAtual) {
      fecharPasta(pastaAbertaAtual);
    }

    pastaAbertaAtual = botao;
    botao.classList.add('aberta');

    const img = botao.querySelector('.pasta-icon');
    if (img && img.dataset.srcAberta) {
      img.src = img.dataset.srcAberta;
    }
  }

  function fecharPasta(botao) {
    if (!botao) return;

    botao.classList.remove('aberta');

    const img = botao.querySelector('.pasta-icon');
    if (img && img.dataset.srcFechada) {
      img.src = img.dataset.srcFechada;
    }

    pastaAbertaAtual = null;
  }
</script>
