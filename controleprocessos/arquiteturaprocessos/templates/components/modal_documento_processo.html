<!-- COMPONENTE: Modal moderno para exibição de documentos PDF -->
<div id="modalDocumento"
     class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 transition-opacity duration-300 ease-out">
  <div id="conteudoModal"
       class="bg-white rounded-2xl shadow-2xl border-4 border-[#0097A7] w-11/12 max-w-5xl h-[90vh]
              flex flex-col relative overflow-hidden transform scale-95 opacity-0 transition-all duration-300 ease-out">

    <!-- Cabeçalho -->
    <div class="bg-[#0097A7] text-white px-6 py-3 flex justify-between items-center">
      <h3 id="tituloDocumento" class="font-semibold text-lg">Visualização de Documento</h3>
      <button onclick="fecharModalDocumento()" class="hover:text-gray-300 transition" title="Fechar">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Conteúdo (iframe PDF) -->
    <div class="flex-1 bg-gray-100">
      <iframe id="iframeDocumento" src="" class="w-full h-full border-none"></iframe>
    </div>

    <!-- Rodapé -->
    <div class="bg-gray-50 text-right px-6 py-3 border-t border-[#0097A7]">
      <button onclick="fecharModalDocumento()"
              class="px-4 py-2 bg-[#0097A7] text-white font-medium rounded-lg shadow hover:bg-[#008494] transition">
        Fechar
      </button>
    </div>
  </div>
</div>

<!-- Script de controle do modal -->
<script>
  /*
   * Configuração do prefixo da rota do viewer via Django,
   * para não depender de hardcode de caminhos.
   * Isso garante que, mesmo se seu app estiver sob um prefixo,
   * a URL gerada será correta.
   *
   * Ex.: se urls.py tiver path('', include('arquiteturaprocessos.urls')),
   *      isso vira algo como "/doc/pdf/__PATH__/"
   *     se estiver com prefixo "arquiteturaprocessos/", vira
   *      "/arquiteturaprocessos/doc/pdf/__PATH__/"
   */
  window.VIEWER_URL_PLACEHOLDER = "__PATH__";
  try {
    window.VIEWER_URL_TEMPLATE = "{% url 'arquiteturaprocessos:visualizar_pdf' path='__PATH__' %}";
  } catch (e) {
    // Fallback (se este template não tiver acesso ao namespace/URL tag por algum motivo)
    window.VIEWER_URL_TEMPLATE = "/doc/pdf/__PATH__/";
  }

  // Utilitário: codifica cada segmento para manter barras e suportar espaços/acentos
  function _encodePathSegments(path) {
    return path
      .split('/')
      .filter(Boolean)
      .map(s => encodeURIComponent(s))
      .join('/');
  }

  // Monta a URL final do viewer substituindo apenas o placeholder pelo path codificado.
  function _montarUrlViewer(pathRelativoDentroDoMedia) {
    const tpl = window.VIEWER_URL_TEMPLATE || "/doc/pdf/__PATH__/";
    const ph  = window.VIEWER_URL_PLACEHOLDER || "__PATH__";
    const encoded = _encodePathSegments(pathRelativoDentroDoMedia);
    // Garante que não acumulamos barras duplicadas
    return tpl.replace(ph, encoded).replace(/([^:]\/)\/+/g, '$1');
  }

  // Converte qualquer entrada (URL absoluta/relativa, /media/... ou path puro do modelo)
  // para a rota do viewer. Se for uma URL externa (outro domínio/porta), retorna a URL externa como está.
  function _resolverUrlParaIframe(urlEntrada) {
    const origin = window.location.origin;
    const mediaPrefix = '/media/';
    let urlFinal = null;

    // 1) Se já vier no formato do viewer (/doc/pdf/...), mantenha
    try {
      const u = new URL(urlEntrada, origin);
      const pathname = u.pathname;

      // Detecta se já é a rota do viewer (com ou sem prefixo do app)
      if (pathname.includes('/doc/pdf/')) {
        urlFinal = `${pathname}${u.search || ''}${u.hash || ''}`;
        console.debug('[viewer] Já é rota /doc/pdf, mantendo:', urlFinal);
        return urlFinal;
      }

      // Mesma origem? (somente nesse caso convertemos /media/ -> /doc/pdf/)
      if (u.origin === origin) {
        if (pathname.startsWith(mediaPrefix)) {
          // Remove /media/ e monta a rota do viewer
          const relativo = decodeURIComponent(pathname.slice(mediaPrefix.length));
          urlFinal = _montarUrlViewer(relativo);
          console.debug('[viewer] Convertido de /media/ para viewer:', urlFinal);
          return urlFinal;
        }

        // Pode ser um caminho relativo interno (sem /media/ explícito)
        // Ex.: "modelagemprocessos/arquivo.pdf"
        // Se não houver /media/, assumimos que é path relativo ao MEDIA_ROOT
        if (!pathname.startsWith('/')) {
          const relativo = decodeURIComponent(pathname);
          urlFinal = _montarUrlViewer(relativo);
          console.debug('[viewer] Caminho relativo tratado como MEDIA:', urlFinal);
          return urlFinal;
        }

        // Se caiu aqui, é mesma origem mas não está sob /media/.
        // Provavelmente é uma URL de página; nesse caso tentamos direto (pode não ser PDF).
        console.debug('[viewer] Mesma origem mas não é /media/ nem /doc/pdf/. Usando direto:', u.href);
        return u.href;
      } else {
        // 2) URL externa (outro host/porta): tenta abrir direto no iframe
        // (Se o servidor externo tiver X-Frame-Options bloqueando, o navegador impedirá.)
        console.debug('[viewer] URL externa detectada. Usando direto:', u.href);
        return u.href;
      }
    } catch (e) {
      // 3) Fallback quando urlEntrada não parseia como URL (string simples)
      // Pode ser: "/media/..." ou "modelagemprocessos/arquivo.pdf"
      console.debug('[viewer] Fallback de parsing. String recebida:', urlEntrada);
      let s = String(urlEntrada || '');
      if (s.startsWith(mediaPrefix)) {
        // Remove "/media/"
        s = s.slice(mediaPrefix.length);
      } else {
        // Remove host + /media/ se presente
        s = s.replace(/^https?:\/\/[^/]+\/media\//, '');
        // Remove barras iniciais
        s = s.replace(/^\/+/, '');
      }
      try { s = decodeURIComponent(s); } catch (_) {}
      urlFinal = _montarUrlViewer(s);
      console.debug('[viewer] Fallback convertido para viewer:', urlFinal);
      return urlFinal;
    }
  }
  function abrirModalDocumento(url, titulo) {
    const modal = document.getElementById('modalDocumento');
    const conteudo = document.getElementById('conteudoModal');
    const iframe = document.getElementById('iframeDocumento');
    const tituloElem = document.getElementById('tituloDocumento');

    if (!modal || !conteudo || !iframe || !tituloElem) {
      console.error('[viewer] Elementos do modal não encontrados. Verifique os IDs: modalDocumento, conteudoModal, iframeDocumento, tituloDocumento.');
      return;
    }

    // ✅ Único ajuste: resolver a URL para a rota segura, quando aplicável
    let urlIframe = url;
    if (!url.startsWith("blob:")) {
        urlIframe = _resolverUrlParaIframe(url);
    }
    iframe.src = urlIframe;

    // Título (inalterado)
    tituloElem.textContent = titulo || 'Documento';

    // Mostra o modal com fade-in + zoom-in (inalterado)
    modal.classList.remove('hidden');
    modal.classList.add('flex');

    // Delay para animação suave (inalterado)
    setTimeout(() => {
      conteudo.classList.remove('scale-95', 'opacity-0');
      conteudo.classList.add('scale-100', 'opacity-100');
    }, 10);
  }

  function fecharModalDocumento() {
    const modal = document.getElementById('modalDocumento');
    const conteudo = document.getElementById('conteudoModal');
    const iframe = document.getElementById('iframeDocumento');

    if (!modal || !conteudo || !iframe) {
      console.error('[viewer] Elementos do modal não encontrados ao fechar.');
      return;
    }

    // Animação de fechamento (fade + zoom out) (inalterado)
    conteudo.classList.remove('scale-100', 'opacity-100');
    conteudo.classList.add('scale-95', 'opacity-0');

    // Após a animação, esconde o modal (inalterado)
    setTimeout(() => {
      modal.classList.remove('flex');
      modal.classList.add('hidden');
      iframe.src = ''; // limpa o iframe
    }, 250);
  }
</script>
