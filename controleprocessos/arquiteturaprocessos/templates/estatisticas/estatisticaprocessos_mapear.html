{% extends "base.html" %}
{% load static %}

{% block titulo %}
Processos a Mapear
{% endblock %}

{% block body %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>

.canvas-grafico{
    height: 400px !important;
}

</style>

<div class="container mx-auto max-w-[1200px] px-4">

    <h1 class="text-2xl font-semibold text-blue-800 mb-4">
        📊 Processos a Mapear
    </h1>

    <div class="bg-white p-4 rounded-lg shadow">

        <h3 class="text-blue-700 font-semibold text-sm mb-3">
            Processos a Mapear por Área
        </h3>

        <canvas id="graficoMapear" class="canvas-grafico"></canvas>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script>

Chart.register(ChartDataLabels);

const labels  = {{ labels|safe }};
const valores = {{ valores|safe }};

// descobrir valor máximo
const maxValor = Math.max(...valores);

new Chart(
    document.getElementById("graficoMapear"),
    {
        type:"bar",

        data:{
            labels:labels,
            datasets:[{
                label:"Processos a Mapear",
                data:valores,

                backgroundColor:[
                    "#3b82f6",
                    "#10b981",
                    "#f59e0b",
                    "#ef4444",
                    "#8b5cf6",
                    "#06b6d4",
                    "#84cc16"
                ],

                borderRadius:6,
                maxBarThickness:50
            }]
        },

        options:{
            responsive:true,
            maintainAspectRatio:false,

            plugins:{
                legend:{display:false},

                datalabels:{
                    anchor:"end",
                    align:"top",
                    offset:4,
                    color:"#334155",
                    font:{
                        weight:"bold",
                        size:12
                    }
                }
            },

            scales:{
                y:{
                    beginAtZero:true,

                    // 🔵 aqui resolvemos o problema
                    max:maxValor + 1,

                    ticks:{
                        stepSize:1
                    }
                }
            }
        }
    }
);

</script>

{% endblock %}
