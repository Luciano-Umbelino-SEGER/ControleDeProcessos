{% extends "base.html" %}
{% load static %}

{% block titulo %}
Processos a Mapear
{% endblock %}

{% block body %}

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Plugin para datalabels -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>

.canvas-grafico {
    height: 400px !important;
}

</style>

<div class="container mx-auto max-w-[1200px] px-4">

    <h1 class="text-2xl font-semibold text-blue-800 mb-4">
        📊 Processos a Mapear
    </h1>

    <div class="bg-white p-4 rounded-lg shadow">

        <h3 class="text-blue-700 font-semibold text-sm mb-3">
            Processos a Mapear por Área (Ranking)
        </h3>

        <canvas id="graficoMapear" class="canvas-grafico"></canvas>

    </div>

</div>

<script>

Chart.register(ChartDataLabels);

/* -----------------------------
DADOS VINDOS DO DJANGO
----------------------------- */

const labels  = {{ labels|safe }};
const valores = {{ valores|safe }};

/* -----------------------------
ORDENAR POR QUANTIDADE (ranking)
----------------------------- */

const dadosOrdenados = labels
    .map((label, i) => ({
        label: label,
        valor: valores[i]
    }))
    .sort((a, b) => b.valor - a.valor);

const labelsOrdenados  = dadosOrdenados.map(d => d.label);
const valoresOrdenados = dadosOrdenados.map(d => d.valor);


/* -----------------------------
CORES PADRÃO DO SIGEMP
linha forte + preenchimento suave
----------------------------- */

const coresBorda = [
    "#3b82f6",
    "#10b981",
    "#f59e0b",
    "#ef4444",
    "#8b5cf6",
    "#06b6d4",
    "#84cc16"
];

const coresFundo = [
    "rgba(59,130,246,0.25)",
    "rgba(16,185,129,0.25)",
    "rgba(245,158,11,0.25)",
    "rgba(239,68,68,0.25)",
    "rgba(139,92,246,0.25)",
    "rgba(6,182,212,0.25)",
    "rgba(132,204,22,0.25)"
];


/* -----------------------------
VALOR MÁXIMO DO EIXO
----------------------------- */

const maxValor = Math.max(...valoresOrdenados);


/* -----------------------------
GRÁFICO
----------------------------- */

new Chart(
    document.getElementById("graficoMapear"),
    {

        type: "bar",

        data: {

            labels: labelsOrdenados,

            datasets: [{
                label: "Processos a Mapear",
                data: valoresOrdenados,

                backgroundColor: coresFundo,
                borderColor: coresBorda,
                borderWidth: 2,

                borderRadius: 6,
                maxBarThickness: 50
            }]
        },

        options: {

            responsive: true,
            maintainAspectRatio: false,

            plugins: {

                legend: {
                    display: false
                },

                datalabels: {

                    anchor: "end",
                    align: "top",
                    offset: 4,

                    color: function(context) {
                        return coresBorda[context.dataIndex];
                    },

                    font: {
                        weight: "bold",
                        size: 12
                    }
                }
            },

            scales:{

                x:{
                    grid:{
                        display:false
                    }
                },

                y:{
                    beginAtZero:true,
                    max:maxValor + 1,

                    ticks:{
                        stepSize:1
                    },

                    grid:{
                        color:"rgba(148,163,184,0.15)",
                        drawBorder:false
                    }
                }
            }
        }
    }
);

</script>

{% endblock %}
