{% extends "base.html" %}
{% load static %}

{% block titulo %}
Processos a Mapear
{% endblock %}

{% block body %}

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Plugin para datalabels -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>

.canvas-grafico {
    height: 400px !important;
}

</style>

<div class="container mx-auto max-w-[1200px] px-4">

    <h1 class="text-2xl font-semibold text-blue-800 mb-4">
        📊 Processos a Mapear
    </h1>

    <div class="bg-white p-4 rounded-lg shadow">

        <h3 class="text-blue-700 font-semibold text-sm mb-3">
            Processos a Mapear por Área (Ranking)
        </h3>

        <canvas id="graficoMapear" class="canvas-grafico"></canvas>

    </div>

</div>

<script src="{% static 'js/charts-utils.js' %}"></script>

<script>
Chart.register(ChartDataLabels);

/* -----------------------------
DADOS
----------------------------- */

const labels  = {{ labels|safe }};
const valores = {{ valores|safe }};

function quebrarLabel(texto, limite = 20) {
    if (!texto) return "Sem área";

    const palavras = texto.split(" ");
    let linhas = [];
    let linhaAtual = "";

    palavras.forEach(palavra => {
        if ((linhaAtual + " " + palavra).length > limite) {
            linhas.push(linhaAtual.trim());
            linhaAtual = palavra;
        } else {
            linhaAtual += " " + palavra;
        }
    });

    if (linhaAtual) linhas.push(linhaAtual.trim());

    return linhas;
}

/* -----------------------------
ORDENAÇÃO (ranking)
----------------------------- */

const dadosOrdenados = labels
    .map((label, i) => ({
        label: label,
        valor: valores[i]
    }))
    .sort((a, b) => b.valor - a.valor);

const labelsOrdenados  = dadosOrdenados.map(d => d.label);
const valoresOrdenados = dadosOrdenados.map(d => d.valor);

/* -----------------------------
CORES PADRÃO (GLOBAL)
----------------------------- */

const cores = gerarCoresPadrao(labelsOrdenados.length);

/* -----------------------------
ESCALA
----------------------------- */

const maxValor = Math.max(...valoresOrdenados, 0);

/* -----------------------------
GRÁFICO
----------------------------- */

new Chart(
    document.getElementById("graficoMapear"),
    {
        type: "bar",

        data: {
            labels: labelsOrdenados.map(l => quebrarLabel(l)),

            datasets: [{
                label: "Processos a Mapear",
                data: valoresOrdenados,

                backgroundColor: cores.bg,
                borderColor: cores.border,
                borderWidth: 2,

                borderRadius: 6,
                maxBarThickness: 50
            }]
        },

        options: {

            responsive: true,
            maintainAspectRatio: false,

            plugins: {

                tooltip: {
                    callbacks: {
                        title: function(context) {
                            return context[0].label.join(" ");
                        }
                    }
                },

                legend: { display: false },

                datalabels: {

                    anchor: "end",
                    align: "top",
                    offset: 4,

                    color: (ctx) => cores.border[ctx.dataIndex],

                    font: {
                        weight: "bold",
                        size: 12
                    }
                }
            },

            scales: {

                x: {
                    grid: { display: false },

                    ticks: {
                        maxRotation: 45,
                        minRotation: 30,
                        autoSkip: false
                    }
                }, // 🔥 FECHAMENTO DO X

                y: {
                    beginAtZero: true,
                    max: maxValor + 1,

                    ticks: { stepSize: 1 },

                    grid: {
                        color: "rgba(148,163,184,0.15)",
                        drawBorder: false
                    }
                }
            }
        }
    }
);
</script>

{% endblock %}
