{% extends "base.html" %}
{% load static %}

{% block titulo %}
Estatísticas
{% endblock %}

{% block body %}

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Plugin para valores nas fatias -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>

.canvas-compact {
    height: 310px !important;
}

.dashboard-container {
    overflow-x: hidden;
}

.bg-white {
    background: linear-gradient(180deg, #ffffff, #fbfbfb);
}

.shadow {
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

canvas {
    transition: transform 0.15s ease;
}

canvas:hover {
    transform: scale(1.02);
}

</style>

<div class="container mx-auto max-w-[1400px] px-4 sm:px-6 lg:px-8 dashboard-container">

    <!-- Título -->
    <h1 class="text-2xl font-semibold text-blue-800 mb-4">
        📊 Dashboard - SIGEMP
    </h1>

    <!-- GRID -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

        <!-- PROCESSOS POR ESTADO -->

        <div class="bg-white p-3 rounded-lg shadow hover:shadow-md transition">

            <h3 class="text-blue-700 font-semibold text-sm mb-2">
                Processos por Estado
            </h3>

            <canvas id="graficoStatus" class="canvas-compact w-full"></canvas>

        </div>

        <!-- PROCESSOS POR CLASSIFICAÇÃO -->

        <div class="bg-white p-3 rounded-lg shadow hover:shadow-md transition">

            <h3 class="text-blue-700 font-semibold text-sm mb-2">
                Processos por Classificação
            </h3>

            <canvas id="graficoClassificacao" class="canvas-compact w-full"></canvas>

        </div>

        <!-- PROCESSOS POR MÊS -->

        <div class="bg-white p-3 rounded-lg shadow hover:shadow-md transition sm:col-span-2">

            <h3 class="text-blue-700 font-semibold text-sm mb-2">
                Processos por Mês
            </h3>

            <canvas id="graficoMes" class="canvas-compact w-full"></canvas>

        </div>

        <!-- MODAL EXPANDIDO -->

        <div id="modalGrafico" class="fixed inset-0 hidden items-center justify-center bg-black/50 z-50">

            <div class="bg-white rounded-lg shadow-xl w-[900px] max-w-[95%] p-4 relative">

                <button onclick="fecharModalGrafico()"
                        class="absolute top-2 right-3 text-gray-500 hover:text-gray-800 text-xl">
                    ✕
                </button>

                <canvas id="graficoExpandido" style="height:500px"></canvas>

            </div>

        </div>

    </div>

</div>

<script src="{% static 'js/charts-utils.js' %}"></script>

<script>
Chart.register(ChartDataLabels);

/* ---------------------------------
DADOS DO DJANGO
--------------------------------- */

const statusLabels  = {{ status_labels|default:"[]"|safe }};
const statusValores = {{ status_valores|default:"[]"|safe }};

const classLabels   = {{ class_labels|default:"[]"|safe }};
const classValores  = {{ class_valores|default:"[]"|safe }};

const mesLabels     = {{ mes_labels|default:"[]"|safe }};
const mesValores    = {{ mes_valores|default:"[]"|safe }};


/* ---------------------------------
PROCESSOS POR ESTADO
--------------------------------- */

const coresStatus = gerarCores(statusLabels, CORES_STATUS);

const chartStatus = new Chart(
    document.getElementById("graficoStatus"),
    {
        type: "pie",
        data: {
            labels: statusLabels,
            datasets: [{
                data: statusValores,
                backgroundColor: coresStatus.bg,
                borderColor: coresStatus.border,
                borderWidth: 2
            }]
        },
        options: {
            ...pieOptions(statusLabels, CORES_STATUS),

            onClick: function(evt, elements) {
                if (elements.length) {
                    const index = elements[0].index;
                    const status = this.data.labels[index];

                    window.location.href =
                        "/processos/?status=" + encodeURIComponent(status);
                }
            }
        }
    }
);

document
    .getElementById("graficoStatus")
    .addEventListener("dblclick", () => abrirGrafico(chartStatus));


/* ---------------------------------
PROCESSOS POR CLASSIFICAÇÃO
--------------------------------- */

const coresClass = gerarCores(classLabels, CORES_CLASS);

const chartClassificacao = new Chart(
    document.getElementById("graficoClassificacao"),
    {
        type: "doughnut",
        data: {
            labels: classLabels,
            datasets: [{
                data: classValores,
                backgroundColor: coresClass.bg,
                borderColor: coresClass.border,
                borderWidth: 2
            }]
        },
        options: {
            ...pieOptions(classLabels, CORES_CLASS),

            onClick: function(evt, elements) {
                if (elements.length) {
                    const index = elements[0].index;
                    const classificacao = this.data.labels[index];

                    window.location.href =
                        "/processos/?classificacao=" + encodeURIComponent(classificacao);
                }
            }
        }
    }
);

document
    .getElementById("graficoClassificacao")
    .addEventListener("dblclick", () => abrirGrafico(chartClassificacao));


/* ---------------------------------
PROCESSOS POR MÊS
--------------------------------- */

const maxValorMes = Math.max(...mesValores);

const chartMes = new Chart(
    document.getElementById("graficoMes"),
    {
        type: "line",
        data: {
            labels: mesLabels,
            datasets: [{
                label: "Processos Criados",
                data: mesValores,
                borderColor: "#3b82f6",
                backgroundColor: "rgba(59,130,246,0.2)",
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointHoverRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,

            scales: {
                x: { grid: { display: false } },
                y: {
                    beginAtZero: true,
                    max: maxValorMes + 1,
                    ticks: { stepSize: 1 },
                    grid: {
                        color: "rgba(148,163,184,0.15)",
                        drawBorder: false
                    }
                }
            },

            plugins: {
                datalabels: {
                    align: "top",
                    anchor: "end",
                    color: "#1e3a8a",
                    font: { weight: "bold" }
                }
            },

            onClick: function(evt, elements) {
                if (elements.length) {
                    const index = elements[0].index;
                    const mes = this.data.labels[index];

                    window.location.href =
                        "/processos/?mes=" + encodeURIComponent(mes);
                }
            }
        }
    }
);

document
    .getElementById("graficoMes")
    .addEventListener("dblclick", () => abrirGrafico(chartMes));


/* ---------------------------------
MODAL EXPANDIDO
--------------------------------- */

let chartExpandido = null;

function abrirGrafico(chart) {

    const modal = document.getElementById("modalGrafico");

    modal.classList.remove("hidden");
    modal.classList.add("flex");

    const ctx = document.getElementById("graficoExpandido");

    const card = chart.canvas.closest(".bg-white");
    const titulo = card.querySelector("h3").innerText;

    if (chartExpandido) {
        chartExpandido.destroy();
    }

    chartExpandido = new Chart(ctx, {
        type: chart.config.type,
        data: {
            labels: [...chart.data.labels],
            datasets: chart.data.datasets.map(ds => ({ ...ds }))
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: true,
                    text: titulo,
                    align: "start",
                    color: "#1d4ed8",
                    font: {
                        size: 14,
                        weight: "600"
                    }
                }
            }
        }
    });
}

function fecharModalGrafico() {
    document.getElementById("modalGrafico").classList.add("hidden");
}
</script>

{% endblock %}
