{% extends "base.html" %}
{% load static %}

{% block titulo %}
Comparativos
{% endblock %}

{% block body %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>
.canvas-grafico{
    height:400px !important;
}
</style>

<div class="container mx-auto max-w-[1200px] px-4">

    <h1 class="text-2xl font-semibold text-blue-800 mb-4">
        📊 Comparativos
    </h1>

    <div class="bg-white p-4 rounded-lg shadow">

        <h3 class="text-blue-700 font-semibold text-sm mb-3">
            Processos Criados x Concluídos por Mês
        </h3>

        <canvas id="graficoComparativo" class="canvas-grafico"></canvas>

    </div>

</div>

<script>
Chart.register(ChartDataLabels);

const labels = {{ labels|safe }};
const criados = {{ criados|safe }};
const concluidos = {{ concluidos|safe }};

// descobrir valor máximo
const maxValor = Math.max(
    ...criados,
    ...concluidos
);

new Chart(
    document.getElementById("graficoComparativo"),
    {
        type:"line",

        data:{
            labels:labels,

            datasets:[
                {
                    label:"Processos Criados",

                    data:criados,

                    borderColor:"#f59e0b",
                    backgroundColor:"rgba(245,158,11,0.15)",

                    fill:true,
                    tension:0.3,
                    pointRadius:4
                },

                {
                    label:"Processos Concluídos",

                    data:concluidos,

                    borderColor:"#ef4444",
                    backgroundColor:"rgba(239,68,68,0.15)",

                    fill:true,
                    tension:0.3,
                    pointRadius:4
                }
            ]
        },

        options:{
            responsive:true,
            maintainAspectRatio:false,

            plugins:{
                legend:{
                    position:"top"
                },

                datalabels:{
                    align:"top",
                    anchor:"end",
                    font:{
                        weight:"bold"
                    }
                }
            },

            scales:{
                y:{
                    beginAtZero:true,
                    max:maxValor + 1,
                    ticks:{
                        stepSize:1
                    }
                }
            }
        }
    }
);

</script>

{% endblock %}
