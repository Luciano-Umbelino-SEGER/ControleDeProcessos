{% extends 'base.html' %}
{% load static %}
{% include 'navbar.html' %}

{% block body %}
<div class="py-10 px-4 max-w-xl mx-auto">
    <h2 class="text-2xl font-bold text-blue-800 mb-6">Adicionar Classificação</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
                class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
            Salvar
        </button>
    </form>
</div>
{% endblock %}
